[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coding-agent"
version = "0.1.0"
description = "Autonomous bug-fixing agent: a LangGraph plan-execute-observe loop with sandboxed tools, git-safe edits, and provider-agnostic LLM adapters."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sameer Jameer Sayyad" }]
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "groq>=1.7.0",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "textual>=8.2.8",
]

[project.scripts]
coding-agent = "agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["demo_repo", "demo_repo_logic", "demo_repo_multifile", "demo_repo_git"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["agent"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
