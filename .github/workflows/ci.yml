name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (offline, no API keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run tests with coverage gate
        run: uv run pytest --cov=agent --cov-report=term-missing --cov-fail-under=85

  docker-sandbox:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Verify the container really is isolated (no network, read-only, host files invisible)
        run: RUN_DOCKER_TESTS=1 uv run pytest tests/test_sandbox.py -v
